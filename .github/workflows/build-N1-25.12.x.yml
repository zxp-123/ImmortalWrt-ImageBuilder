name: Build 25.12.x N1 (Native ImageBuilder)

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择 ImmortalWrt 版本"
        required: false
        default: "25.12.2"
        type: choice
        options:
          - 25.12.2
          - 25.12.1
          - 25.12.0
          - 25.12
      openwrt_kernel:
        description: "选择构建的内核(斐讯N1)"
        required: false
        default: "6.6.93"
        type: choice
        options:
          - 5.4.291
          - 5.10.235
          - 5.15.189
          - 6.1.121
          - 6.1.130
          - 6.6.67
          - 6.6.80
          - 6.6.93
          - 6.12.16
          - 6.12.40
      include_docker:
        description: "是否安装 Docker"
        required: false
        default: true
        type: boolean
      rootfs_size:
        description: "根分区大小 (MB)"
        required: false
        default: "1024"
        type: string
      enable_app_store:
        description: "是否集成第三方软件商店/iStore"
        required: false
        default: true
        type: boolean

env:
  TAG_NAME: n1
  CONFIG_FILE: n1/imm25.config
  BUILD_SCRIPT: n1/build25.sh

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialization Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y gettext kpartx util-linux e2fsprogs dosfstools zstd build-essential libncurses5-dev libncursesw5-dev gawk git subversion libssl-dev python3 unzip rsync device-tree-compiler

    - name: Download & Extract ImmortalWrt ImageBuilder Tarball
      run: |
        VERSION="${{ github.event.inputs.luci_version }}"
        echo "正在从官方 Downloads 站获取 ImageBuilder: ${VERSION} ..."
        
        # 匹配压缩包 (支持 .tar.zst 或 .tar.xz)
        BASE_URL="https://downloads.immortalwrt.org/releases/${VERSION}/targets/armsr/armv8"
        
        mkdir -p ib_dir
        cd ib_dir
        
        # 优先寻找 zstd 压缩包，找不到则尝试 xz
        if curl -sI "${BASE_URL}/immortalwrt-imagebuilder-${VERSION}-armsr-armv8.Linux-x86_64.tar.zst" | grep -q "200 OK"; then
          TAR_FILE="immortalwrt-imagebuilder-${VERSION}-armsr-armv8.Linux-x86_64.tar.zst"
          curl -sSL "${BASE_URL}/${TAR_FILE}" -o "${TAR_FILE}"
          tar -I zstd -xf "${TAR_FILE}" --strip-components=1
        elif curl -sI "${BASE_URL}/immortalwrt-imagebuilder-${VERSION}-armsr-armv8.Linux-x86_64.tar.xz" | grep -q "200 OK"; then
          TAR_FILE="immortalwrt-imagebuilder-${VERSION}-armsr-armv8.Linux-x86_64.tar.xz"
          curl -sSL "${BASE_URL}/${TAR_FILE}" -o "${TAR_FILE}"
          tar -xf "${TAR_FILE}" --strip-components=1
        else
          echo "Error: 无法在官方下载站找到 ${VERSION} 的 ImageBuilder 压缩包！"
          exit 1
        fi
        
        echo "ImageBuilder 解压完成！"
        ls -la

    - name: Pre-download APK / OPKG Custom Packages
      run: |
        chmod +x shell/apk-custom-packages.sh || true
        if [ -f "shell/apk-custom-packages.sh" ]; then
          ./shell/apk-custom-packages.sh
        fi

    - name: Prepare Config and Custom Scripts
      run: |
        mkdir -p out packages
        if [ ! -f "${{ env.CONFIG_FILE }}" ]; then
          echo "Error: Config file ${{ env.CONFIG_FILE }} 不存在！"
          exit 1
        fi
        if [ ! -f "${{ env.BUILD_SCRIPT }}" ]; then
          echo "Error: Build script ${{ env.BUILD_SCRIPT }} 不存在！"
          exit 1
        fi
        
        # 将配置与包拷贝到解压好的 ImageBuilder 目录中
        cp -f ${{ env.CONFIG_FILE }} ib_dir/.config
        cp -rf packages/* ib_dir/packages/ || true
        chmod +x ${{ env.BUILD_SCRIPT }}

    - name: Build Firmware RootFS via ImageBuilder
      env:
        LUCI_VERSION: ${{ github.event.inputs.luci_version }}
        OPENWRT_KERNEL: ${{ github.event.inputs.openwrt_kernel }}
        INCLUDE_DOCKER: ${{ github.event.inputs.include_docker }}
        ROOTFS_SIZE: ${{ github.event.inputs.rootfs_size }}
        ENABLE_APP_STORE: ${{ github.event.inputs.enable_app_store }}
      run: |
        cd ib_dir
        
        # 执行 build25.sh 生成 rootfs (在宿主机原生环境下编译)
        bash ../${{ env.BUILD_SCRIPT }}
        
        # 复制生成好的 rootfs 或 bin 文件到 out 目录
        cp -rf bin/targets/armsr/armv8/* ../out/ || true

    - name: Pack N1 S905D .img Firmware (via mk_s905d_n1.sh)
      if: success()
      run: |
        # 如果项目根目录或 n1/ 目录下有打包脚本 (mk_s905d_n1.sh 或类似打包脚本)
        if [ -f "n1/mk_s905d_n1.sh" ]; then
          chmod +x n1/mk_s905d_n1.sh
          cd n1
          sudo ./mk_s905d_n1.sh
          cd ..
          cp -rf n1/out/*.img out/ || cp -rf n1/output/*.img out/ || true
        fi
        
        echo "最终打包完成的文件内容："
        ls -lh out/

    - name: Upload Firmware to GitHub Release
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        tag_name: ${{ env.TAG_NAME }}
        files: out/*
        token: ${{ secrets.GH_TOKEN }}
