      include_docker:
        description: "是否安装 Docker"
        required: false
        default: true
        type: boolean
      rootfs_size:
        description: "根分区大小 (MB)"
        required: false
        default: "1024"
        type: string
      enable_app_store:
        description: "是否集成第三方软件商店/iStore"
        required: false
        default: true
        type: boolean

env:
  TAG_NAME: n1
  CONFIG_FILE: n1/imm25.config
  BUILD_SCRIPT: n1/build25.sh

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      run: |
        sudo apt-get update
        sudo apt-get install -y gettext kpartx util-linux e2fsprogs dosfstools

    - name: Pre-download APK Packages
      run: |
        chmod +x shell/apk-custom-packages.sh || true
        if [ -f "shell/apk-custom-packages.sh" ]; then
          ./shell/apk-custom-packages.sh
        fi

    - name: Check essential build files
      run: |
        mkdir -p out packages
        if [ ! -f "${{ env.CONFIG_FILE }}" ]; then
          echo "Error: Config file ${{ env.CONFIG_FILE }} does not exist!"
          exit 1
        fi
        if [ ! -f "${{ env.BUILD_SCRIPT }}" ]; then
          echo "Error: Build script ${{ env.BUILD_SCRIPT }} does not exist!"
          exit 1
        fi
        chmod +x ${{ env.BUILD_SCRIPT }}

    - name: Run ImageBuilder
      env:
        LUCI_VERSION: ${{ github.event.inputs.luci_version }}
        OPENWRT_KERNEL: ${{ github.event.inputs.openwrt_kernel }}
        INCLUDE_DOCKER: ${{ github.event.inputs.include_docker }}
        ROOTFS_SIZE: ${{ github.event.inputs.rootfs_size }}
        ENABLE_APP_STORE: ${{ github.event.inputs.enable_app_store }}
      run: |
        docker run --rm --privileged \
          -e LUCI_VERSION="${LUCI_VERSION}" \
          -e OPENWRT_KERNEL="${OPENWRT_KERNEL}" \
          -e INCLUDE_DOCKER="${INCLUDE_DOCKER}" \
          -e ROOTFS_SIZE="${ROOTFS_SIZE}" \
          -e ENABLE_APP_STORE="${ENABLE_APP_STORE}" \
          -v ${{ github.workspace }}/out:/home/build/immortalwrt/bin \
          -v ${{ github.workspace }}/${{ env.CONFIG_FILE }}:/home/build/immortalwrt/.config \
          -v ${{ github.workspace }}/${{ env.BUILD_SCRIPT }}:/home/build/immortalwrt/build25.sh \
          -v ${{ github.workspace }}/packages:/home/build/immortalwrt/packages \
          -w /home/build/immortalwrt \
          immortalwrt/imagebuilder:armsr-armv8-${LUCI_VERSION} \
          /bin/bash /home/build/immortalwrt/build25.sh

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        tag_name: ${{ env.TAG_NAME }}
        files: out/*
        token: ${{ secrets.GH_TOKEN }}
