name: Build 25.12.x N1 (God-Org / Flippy PackIt Mode)

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择 ImmortalWrt 25.12.x 版本"
        required: false
        default: "25.12"
        type: choice
        options:
          - "25.12"
          - "25.12.2"
          - "25.12.1"
          - "25.12.0"
      openwrt_kernel:
        description: "选择构建的内核(斐讯N1 S905D)"
        required: false
        default: "6.6.93"
        type: choice
        options:
          - 5.4.291
          - 5.10.235
          - 5.15.189
          - 6.1.121
          - 6.1.130
          - 6.6.67
          - 6.6.80
          - 6.6.93
          - 6.12.16
          - 6.12.40
      include_docker:
        description: "是否安装 Docker"
        required: false
        default: true
        type: boolean
      rootfs_size:
        description: "根分区大小 (MB)"
        required: false
        default: "1024"
        type: string
      enable_app_store:
        description: "是否集成第三方软件商店/iStore"
        required: false
        default: true
        type: boolean

env:
  TAG_NAME: n1-25.12
  CONFIG_FILE: n1/imm25.config
  BUILD_SCRIPT: n1/build25.sh

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialization Host Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y gettext kpartx util-linux e2fsprogs dosfstools zstd build-essential libncurses5-dev libncursesw5-dev gawk git subversion libssl-dev python3 unzip rsync device-tree-compiler pigz jq

    - name: Download & Extract 25.12.x ArmsR ImageBuilder
      run: |
        VERSION="${{ github.event.inputs.luci_version }}"
        echo "=========================================="
        echo "开始获取 ImmortalWrt 25.12.x ImageBuilder"
        echo "=========================================="
        
        mkdir -p ib_dir
        cd ib_dir

        URL_PATHS=(
          "https://downloads.immortalwrt.org/snapshots/targets/armsr/armv8"
          "https://downloads.immortalwrt.org/releases/${VERSION}/targets/armsr/armv8"
        )

        FOUND=0
        for BASE_URL in "${URL_PATHS[@]}"; do
          echo "正在尝试下载源: ${BASE_URL}"
          FILE_LIST=$(curl -sSL "${BASE_URL}/" || true)
          TAR_FILE=$(echo "${FILE_LIST}" | grep -oE 'immortalwrt-imagebuilder-[^"]+\.tar\.(zst|xz)' | head -n 1 || true)

          if [ -n "${TAR_FILE}" ]; then
            echo "找到匹配的 25.12.x ImageBuilder 文件: ${TAR_FILE}"
            curl -sSL "${BASE_URL}/${TAR_FILE}" -o "${TAR_FILE}"

            if [[ "${TAR_FILE}" == *.zst ]]; then
              tar -I zstd -xf "${TAR_FILE}" --strip-components=1
            else
              tar -xf "${TAR_FILE}" --strip-components=1
            fi
            FOUND=1
            break
          fi
        done

        if [ ${FOUND} -ne 1 ]; then
          echo "Error: 未能在官方下载站检索到 25.12.x 的 ImageBuilder 包！"
          exit 1
        fi

        echo "ImageBuilder 解压完成："
        ls -la

    - name: Pre-download Custom APK Packages
      run: |
        chmod -R +x shell/ || true
        if [ -f "shell/apk-custom-packages.sh" ]; then
          ./shell/apk-custom-packages.sh
        fi

    - name: Prepare Build Files & Custom Scripts
      run: |
        mkdir -p out packages
        if [ ! -f "${{ env.CONFIG_FILE }}" ]; then
          echo "Error: 配置文件 ${{ env.CONFIG_FILE }} 不存在！"
          exit 1
        fi
        if [ ! -f "${{ env.BUILD_SCRIPT }}" ]; then
          echo "Error: 构建脚本 ${{ env.BUILD_SCRIPT }} 不存在！"
          exit 1
        fi

        # 1. 注入配置与 packages 到 ImageBuilder 目录
        cp -f ${{ env.CONFIG_FILE }} ib_dir/.config
        cp -rf packages/* ib_dir/packages/ || true
        
        # 2. 关键修复：同步将项目根目录下的 shell 脚本文件夹拷贝进 ImageBuilder 目录，解决相对路径找不到问题
        if [ -d "shell" ]; then
          cp -rf shell ib_dir/
          chmod -R +x ib_dir/shell/
        fi

        # 3. 给 build25.sh 添加可执行权限并复制到 ImageBuilder 内部
        chmod +x ${{ env.BUILD_SCRIPT }}
        cp -f ${{ env.BUILD_SCRIPT }} ib_dir/build25.sh

    - name: Build 25.12.x RootFS (Native Execution)
      env:
        LUCI_VERSION: ${{ github.event.inputs.luci_version }}
        OPENWRT_KERNEL: ${{ github.event.inputs.openwrt_kernel }}
        INCLUDE_DOCKER: ${{ github.event.inputs.include_docker }}
        ROOTFS_SIZE: ${{ github.event.inputs.rootfs_size }}
        ENABLE_APP_STORE: ${{ github.event.inputs.enable_app_store }}
      run: |
        cd ib_dir
        # 在 ImageBuilder 根目录下直接运行内部拷贝的 build25.sh
        bash ./build25.sh

        # 收集生成的 rootfs 压缩包到 out 目录
        mkdir -p ../out
        find bin/targets/armsr/armv8/ -name "*rootfs*.tar.gz" -exec cp -f {} ../out/ \; || true
        find bin/targets/armsr/armv8/ -name "*.img.gz" -exec cp -f {} ../out/ \; || true

    - name: Package Phicomm N1 S905D (.img) Firmware
      env:
        OPENWRT_KERNEL: ${{ github.event.inputs.openwrt_kernel }}
        ROOTFS_SIZE: ${{ github.event.inputs.rootfs_size }}
      run: |
        PACK_SCRIPT=""
        if [ -f "n1/mk_s905d_n1.sh" ]; then
          PACK_SCRIPT="n1/mk_s905d_n1.sh"
        elif [ -f "mk_s905d_n1.sh" ]; then
          PACK_SCRIPT="mk_s905d_n1.sh"
        fi

        if [ -n "${PACK_SCRIPT}" ]; then
          echo "=========================================="
          echo "找到打包脚本: ${PACK_SCRIPT}，开始生成 N1 S905D .img 镜像"
          echo "=========================================="
          
          chmod +x ${PACK_SCRIPT}
          
          ROOTFS_TAR=$(find out/ -name "*rootfs*.tar.gz" | head -n 1)
          
          if [ -f "${ROOTFS_TAR}" ]; then
            echo "使用生成的 25.12.x rootfs: ${ROOTFS_TAR}"
            
            WORK_DIR=$(dirname ${PACK_SCRIPT})
            cp -f ${ROOTFS_TAR} ${WORK_DIR}/openwrt-armsr-armv8-rootfs.tar.gz || true
            
            cd ${WORK_DIR}
            sudo ./$(basename ${PACK_SCRIPT})
            cd -
            
            find ${WORK_DIR} -maxdepth 2 -name "*.img*" -exec cp -f {} out/ \; || true
          fi
        else
          echo "未找到 mk_s905d_n1.sh 打包脚本，仅输出生成的 RootFS。"
        fi

        echo "最终 Release 输出目录："
        ls -lh out/

    - name: Upload N1 25.12.x Firmware to Release
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        tag_name: ${{ env.TAG_NAME }}
        files: out/*
        token: ${{ secrets.GH_TOKEN }}
